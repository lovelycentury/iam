name: deploy
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# Repository secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, DEPLOY_PATH.
# The VPS must be logged in to ghcr.io (or the package made public) so that
# `docker compose pull` can fetch the image, and DEPLOY_PATH must already hold
# the `.env` with IAM_DB_PASSWORD and the KC_BOOTSTRAP_ADMIN_* pair.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Compiles the Keycloakify theme, then bakes it into Keycloak as a
      # provider JAR and runs `kc.sh build` — see Dockerfile.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/lovelycentury/iam:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "ops/docker-compose.yml"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1 # drop the ops/ prefix
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose pull
            docker compose up -d --remove-orphans
